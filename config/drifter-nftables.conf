#!/usr/sbin/nft -f
# MZ1312 DRIFTER — opt-in host firewall (installed by scripts/install-firewall.sh)
#
# Scope: ONLY the node's own service ports. They are reachable from loopback
# and the hotspot interface (wlan0, 10.42.0.0/24) and dropped on every other
# interface (home Wi-Fi, Ethernet, USB tether). SSH and everything else are
# left alone, so this cannot lock you out of the Pi.
#
# Ports: 8080 dashboard · 8081 telemetry WS · 8082 audio WS · 8090 OPSEC
#        35000 RealDash · 1883 MQTT (TCP)
# The fleet API (8420) is deliberately NOT restricted: it is meant to be
# reached from the home LAN and is protected by login (fleet_server.py
# set-password) instead.
#
# Remove with: sudo nft delete table inet drifter

table inet drifter
delete table inet drifter

table inet drifter {
    set drifter_tcp {
        type inet_service
        elements = { 8080, 8081, 8082, 8090, 35000, 1883 }
    }

    chain input {
        type filter hook input priority 0; policy accept;
        iif "lo" accept
        tcp dport @drifter_tcp iifname "wlan0" ip saddr 10.42.0.0/24 accept
        tcp dport @drifter_tcp counter drop
    }
}
