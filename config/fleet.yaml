# MZ1312 DRIFTER — Fleet Server config
# Deployed to /opt/drifter/fleet.yaml. Edit and restart drifter-fleet.

# REST + WebSocket bind
host: 0.0.0.0
port: 8420

# SQLite storage path (overrides default)
db_path: /opt/drifter/data/fleet.db

# JWT TTL in seconds (24h = 86400)
jwt_ttl: 86400

# Vehicle considered offline if heartbeat older than this (seconds)
heartbeat_timeout: 90

# Auth: /api/auth/login only issues a token for a user in the fleet DB's
# users table whose password verifies (scrypt). Create users with:
#   python3 /opt/drifter/fleet_server.py set-password <username> [admin|viewer]
# With no users configured, nobody can log in. The list below is not read.
users:
  - username: admin
    role: admin
    # password_hash: $2b$12$...
  - username: viewer
    role: viewer

# Optional retention / pruning
telemetry_retention_hours: 168    # 7 days
prune_interval_minutes: 60

# Optional remote sync (push aggregates to a parent Sentient Core)
remote_sync:
  enabled: false
  host: sentient.local
  port: 1883
