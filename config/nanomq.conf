# MZ1312 DRIFTER — NanoMQ Configuration

# Loopback-only, matching the Mosquitto default. Hotspot clients reach the node
# over HTTP/WS (dashboard :8080 / :8081), never MQTT directly, so the broker is
# not exposed on the 10.42.0.0/24 AP subnet.
listeners.tcp {
    bind = "127.0.0.1:1883"
}

log {
    to = [file]
    level = warn
    dir = "/var/log/nanomq"
    file = "nanomq.log"
    rotation {
        size = 10MB
        count = 3
    }
}
