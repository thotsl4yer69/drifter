# DRIFTER ELM327 configuration reference.
# Runtime settings are read from /opt/drifter/.env (systemd EnvironmentFile).
# This YAML is documentation only; it is not silently loaded by the bridge.
# DRIFTER_ELM_LINK=auto|serial|bluetooth|wifi
# OBD_SERIAL_DEV=/dev/drifter-obd
# OBD_SERIAL_BAUD=38400
# ELM_BT_MAC=<reader Bluetooth Classic address>
# ELM_BT_CHANNEL=<reader RFCOMM channel, normally 1>
# ELM_WIFI_HOST=<reader address from its instructions>
# ELM_WIFI_PORT=<reader TCP port from its instructions>
# OBD_POLL_HZ=5                 aggregate request ceiling, not per-PID Hz
# ELM_TIMEOUT=1                connection/write timeout in seconds
# DRIFTER_TRANSPORT=elm327     force ELM ownership on a K-line Jaguar
# The bridge retries indefinitely with backoff; it never reboots the Pi.
