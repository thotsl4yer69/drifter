name: android-build

# Verifies both Android interfaces and publishes a debug APK for device testing.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: verify DRIFTER and Medic
    runs-on: ubuntu-latest
    # Google Maps key is injected from a repo secret, never committed. Gradle
    # maps ORG_GRADLE_PROJECT_<name> env vars to the MAPS_API_KEY project
    # property (see app/build.gradle.kts). Empty/unset is fine — the app still
    # builds; the Map tab just shows its "no key" banner. Add the secret under
    # Settings → Secrets and variables → Actions → MAPS_API_KEY to enable maps.
    env:
      ORG_GRADLE_PROJECT_MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: set up jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Modern ubuntu runners already carry the SDK command-line tools.
      # setup-android@v3 tries to install the removed legacy "tools" package.
      - name: install android sdk packages
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Runner Android SDK missing}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: make gradlew executable
        run: chmod +x ./gradlew

      - name: unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: upload unit and interface regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-reports
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/ui/
          if-no-files-found: warn

      - name: assemble debug and unsigned release apk
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: android lint
        # Errors block compatibility; advisory warnings remain in the report.
        run: ./gradlew lintDebug --no-daemon

      - name: upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results-*
          if-no-files-found: warn

      - name: upload debug apk
        uses: actions/upload-artifact@v4
        with:
          name: drifter-diagnostics-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
