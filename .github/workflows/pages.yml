name: Deploy DRIFTER VIM beta site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test publication and touchscreen contracts
        run: node --test site/publication.test.mjs site/touchscreen.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build public website
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VERCEL_ENV: production
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: node site/build.mjs
      - name: Upload compiled site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
