drifter:
  ssh_host:    kali@192.168.1.112           # home WiFi (DG2144-B817) DHCP lease, client mode
                                            # bench fallback: join MZ1312_DRIFTER WPA(TKIP), then 10.42.0.1
                                            # future stable access: Tailscale host 'drifter' (install done, join pending auth)
  ssh_user:    kali
  repo:        git@github.com:thotsl4yer69/drifter.git
  branch:      main
  workdir:     /home/kali/drifter

  # ── DEPLOY_CONTRACT artefacts ──────────────────────────────────────
  deploy:      scripts/oneshot.sh            # stage gates 10/20/30/40 → /healthz
  diagnose:    drifter diagnose --json       # /usr/local/bin/drifter installed by oneshot.sh
  healthz:     http://192.168.1.112:8080/healthz # 200 = ok, 503 = degraded; 2s server-side cache (bench/AP path: http://10.42.0.1:8080/healthz)

  # ── Operational metadata ───────────────────────────────────────────
  vehicle:     "2004 Jaguar X-Type 2.5 V6 (AJ-V6)"
  hardware:    "Raspberry Pi 5 Model B Rev 1.1, 16GB RAM, Kali GNU/Linux Rolling aarch64, 128GB SD (mmcblk0, NO NVMe)"
  hotspot:     MZ1312_DRIFTER                # rescue-only AP (autoconnect falls back to it after 90s);
                                            # PSK intentionally NOT recorded here; current install generates
                                            # or accepts a per-node value outside git
  hotspot_ip:  10.42.0.1/24
  ports:
    dashboard: 8080                          # 0.0.0.0 bind (verified via ss, 2026-08-24)
    ws_telem:  8081
    ws_audio:  8082
    realdash:  35000                         # TCP, not UDP
    mqtt:      1883                          # LOOPBACK-BOUND (127.0.0.1) — broker not exposed to LAN

  # ── Service inventory (38) ─ canonical list = src/config.py SERVICES ─
  services:
    - drifter-canbridge
    - drifter-alerts
    - drifter-logger
    - drifter-anomaly
    - drifter-analyst
    - drifter-voice
    - drifter-vivi
    - drifter-hotspot
    - drifter-homesync
    - drifter-watchdog
    - drifter-realdash
    - drifter-rf
    - drifter-wardrive
    - drifter-dashboard
    - drifter-voicein
    - drifter-flipper
    - drifter-opsec
    - drifter-bleconv
    - drifter-gps
    - drifter-rfaudio
    - drifter-batcher
    - drifter-trip
    - drifter-thresholds
    - drifter-reporter
    - drifter-weather
    - drifter-location
    - drifter-kismet
    - drifter-kismet-bridge
    - drifter-wifi-audit
    - drifter-marauder
    - drifter-fly-catcher
    - drifter-feeds
    - drifter-can-discovery
    - drifter-hid
    - drifter-lcd
    - drifter-autoconnect
